<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caption Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Hidden YouTube player (audio only). -->
    <div id="player"></div>

    <!-- Top title bar. -->
    <div id="mode-badge" class="mode-badge">
      <div class="title-line">
        <span class="dot"></span><span id="title">Caption Player</span>
      </div>
      <div id="author" class="author"></div>
    </div>

    <!-- Caption stage. -->
    <div id="stage" class="stage">
      <div id="caption" class="caption"></div>
    </div>

    <!-- Status / error messages. -->
    <div id="status" class="status"></div>

    <!-- Control bar. -->
    <div id="controls" class="controls">
      <div class="scrim"></div>
      <div class="bar">
        <!-- Play / Pause -->
        <button id="playpause" class="ico-btn" type="button" aria-label="Play/Pause">
          <svg class="icon-pause" width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
            <rect x="5.5" y="4" width="4.2" height="16" rx="1"></rect>
            <rect x="14.3" y="4" width="4.2" height="16" rx="1"></rect>
          </svg>
          <svg class="icon-play" width="34" height="34" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 3.8c0-.95 1.03-1.54 1.85-1.06l13.2 7.7c.82.48.82 1.66 0 2.14l-13.2 7.7C7.03 20.76 6 20.17 6 19.22V3.8z"></path>
          </svg>
        </button>

        <!-- Seek bar -->
        <div class="seek-wrap">
          <span id="cur-time" class="time">0:00</span>
          <div id="seek-track" class="seek-track">
            <div class="seek-bg"></div>
            <div id="seek-fill" class="seek-fill"></div>
            <div id="seek-knob" class="seek-knob"></div>
          </div>
          <span id="dur-time" class="time">0:00</span>
        </div>

        <!-- Caption mode toggle -->
        <button id="mode-toggle" class="pill-btn" type="button" aria-label="Caption mode">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v9A2.5 2.5 0 0 1 18.5 17H8.7l-3.5 3.2c-.64.58-1.7.13-1.7-.74V5.5zm4.6 4.2c-1.05 0-1.7.72-1.7 1.8s.65 1.8 1.7 1.8c.66 0 1.13-.25 1.45-.7l-.86-.5c-.13.18-.32.28-.57.28-.42 0-.7-.33-.7-.88s.28-.88.7-.88c.25 0 .44.1.57.28l.86-.5c-.32-.45-.79-.7-1.45-.7zm5 0c-1.05 0-1.7.72-1.7 1.8s.65 1.8 1.7 1.8c.66 0 1.13-.25 1.45-.7l-.86-.5c-.13.18-.32.28-.57.28-.42 0-.7-.33-.7-.88s.28-.88.7-.88c.25 0 .44.1.57.28l.86-.5c-.32-.45-.79-.7-1.45-.7z"></path>
          </svg>
          <span id="mode-label">Flow</span>
        </button>

        <!-- Speed -->
        <div class="speed-wrap">
          <div id="speed-menu" class="speed-menu hidden"></div>
          <button id="speed-btn" class="speed-btn" type="button" aria-label="Playback speed">1×</button>
        </div>

        <!-- Volume -->
        <div class="vol-wrap">
          <button id="mute" class="ico-btn small" type="button" aria-label="Mute">
            <svg class="icon-muted" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11 4.5c0-.86-1.02-1.32-1.66-.74L5.4 7.2H3.2c-.66 0-1.2.54-1.2 1.2v7.2c0 .66.54 1.2 1.2 1.2h2.2l3.94 3.44c.64.58 1.66.12 1.66-.74V4.5z"></path>
              <path d="M14.3 9.3a1 1 0 0 1 1.4 0L17.5 11l1.8-1.8a1 1 0 1 1 1.4 1.4L18.9 12.4l1.8 1.8a1 1 0 0 1-1.4 1.4l-1.8-1.8-1.8 1.8a1 1 0 0 1-1.4-1.4l1.8-1.8-1.8-1.8a1 1 0 0 1 0-1.3z"></path>
            </svg>
            <svg class="icon-unmuted" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11 4.5c0-.86-1.02-1.32-1.66-.74L5.4 7.2H3.2c-.66 0-1.2.54-1.2 1.2v7.2c0 .66.54 1.2 1.2 1.2h2.2l3.94 3.44c.64.58 1.66.12 1.66-.74V4.5z"></path>
              <path id="wave1" d="M15.5 8.2a1 1 0 0 1 1.4.1 5.5 5.5 0 0 1 0 7.4 1 1 0 1 1-1.5-1.32 3.5 3.5 0 0 0 0-4.76 1 1 0 0 1 .1-1.42z"></path>
              <path id="wave2" d="M18 5.4a1 1 0 0 1 1.4.06 9.2 9.2 0 0 1 0 13.08 1 1 0 1 1-1.46-1.36 7.2 7.2 0 0 0 0-10.36A1 1 0 0 1 18 5.4z"></path>
            </svg>
          </button>
          <div id="vol-track" class="vol-track">
            <div class="vol-bg"></div>
            <div id="vol-fill" class="vol-fill"></div>
            <div id="vol-knob" class="vol-knob"></div>
          </div>
        </div>

        <!-- Fullscreen -->
        <button id="fullscreen" class="ico-btn" type="button" aria-label="Fullscreen">
          <svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor">
            <path d="M4 4h6v2.4H6.4V10H4V4zm10 0h6v6h-2.4V6.4H14V4zM4 14h2.4v3.6H10V20H4v-6zm13.6 0H20v6h-6v-2.4h3.6V14z"></path>
          </svg>
        </button>
      </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
  </body>
</html>

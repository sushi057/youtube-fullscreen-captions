<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caption Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- The YouTube player lives here but is visually hidden; only audio matters. -->
    <div id="player"></div>

    <!-- Scrolling caption lines render here. -->
    <div id="captions"></div>

    <!-- Status / error messages (no video id, no captions, loading). -->
    <div id="status" class="status"></div>

    <!-- Blurred overlay shown whenever playback is paused / not started. -->
    <div id="overlay" class="overlay">
      <div class="overlay-btn" id="overlay-btn">
        <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 4.5v15l13-7.5z" />
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="4.5" width="4.2" height="15" rx="1" />
          <rect x="13.8" y="4.5" width="4.2" height="15" rx="1" />
        </svg>
      </div>
    </div>

    <!-- Bottom media-player control panel. -->
    <div id="controls" class="player">
      <!-- Secondary options: caption mode, speed, volume. -->
      <div class="player-extra">
        <button id="mode-toggle" class="ctrl-btn" type="button" disabled>
          Phrase
        </button>
        <label class="ctrl">
          <span class="ctrl-label">Speed</span>
          <select id="speed">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <label class="ctrl vol">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9v6h4l5 5V4L8 9H4z" />
          </svg>
          <input id="volume" type="range" min="0" max="100" value="100" />
        </label>
      </div>

      <!-- Seek bar. -->
      <div class="seek-row">
        <span id="cur-time" class="time">0:00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" />
        <span id="dur-time" class="time">0:00</span>
      </div>

      <!-- Transport buttons. -->
      <div class="btn-row">
        <button id="like" class="iconbtn" type="button" aria-label="Like">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
          </svg>
        </button>
        <button id="prev" class="iconbtn" type="button" aria-label="Back 10 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6h2v12H6zM20 6v12L9.5 12z" />
          </svg>
        </button>
        <button id="playpause" class="iconbtn big" type="button" aria-label="Play or pause">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="5" width="3.6" height="14" rx="1" />
            <rect x="13.4" y="5" width="3.6" height="14" rx="1" />
          </svg>
        </button>
        <button id="next" class="iconbtn" type="button" aria-label="Forward 10 seconds">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 6h2v12h-2zM4 6l10.5 6L4 18z" />
          </svg>
        </button>
        <button id="loop" class="iconbtn" type="button" aria-label="Loop">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
          </svg>
        </button>
      </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
  </body>
</html>
